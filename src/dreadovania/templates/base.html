<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {# Strict htmx: no eval, no script tags in responses, same-origin only, no inline styles (CSP). #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "historyCacheSize": 0}'>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101826">
  <title>{% block title %}Dreadovania{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a href="/" class="brand"><img src="/static/icon.svg" alt="" width="28" height="28"> <span class="brand-name">Dreadovania</span></a>
    {% if user %}
    <nav>
      <a href="/presets">Presets</a>
      <a href="/game-files">Game files</a>
      <a href="/switches">Switches</a>
      <a href="/account">Account</a>
    </nav>
    {% endif %}
  </header>
  <main>
    <div id="messages" role="status" aria-live="polite"></div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
