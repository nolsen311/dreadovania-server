{% extends "base.html" %}
{% block title %}Sign in · Dreadovania{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/login" hx-post="/login" hx-target="#messages" class="card stack">
  <label>Username
    <input name="username" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false">
  </label>
  <label>Password
    <input name="password" type="password" required maxlength="1024" autocomplete="current-password">
  </label>
  <button type="submit" class="primary">Sign in</button>
</form>
{% endblock %}
