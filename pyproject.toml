[project]
name = "dreadovania"
version = "0.1.2"
description = "Self-hosted web server for generating and patching Randovania seeds for Metroid Dread."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "mercury-engine-data-structures==0.36.2",
    "open-dread-rando==2.21.0",
    "pydantic-settings>=2.16.2",
    "randovania==12.0.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Source = "https://github.com/nolsen311/dreadovania-server"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "packaging>=26.3",
    "pyftpdlib>=2.2.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Randovania 12.0.0 pins cryptography<49, which is affected by CVE-2026-69247,
# CVE-2026-69248 and CVE-2026-69249 (fixed in 49/50). We override the pin; see
# ADR 0010. tests/test_randovania_cli.py fails once Randovania allows a fixed
# version itself, so this override is removed as soon as it is unnecessary.
override-dependencies = ["cryptography>=50"]
# Resolve for both platforms now so adding arm64 later needs no lockfile rework (ADR 0003).
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests build throwaway git repos with fixed argument lists, and use fixed fake
# passwords (S105-S107); neither is allowed outside tests.
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
# The content guard calls git with a fixed argument list.
"scripts/content_guard.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
