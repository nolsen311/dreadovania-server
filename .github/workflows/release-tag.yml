# SPDX-License-Identifier: GPL-3.0-or-later
#
# "/release" by comment (ADR 0014, ADR 0015): when the repository owner comments exactly
# "/release" on a merged pull request, tag its merge commit with the version in
# pyproject.toml at that commit. The new tag starts the Release workflow.
# Lets the maintainer publish a release from a phone.
#
# Safety:
# - Only an exact "/release" comment from the repository owner (checked here and
#   again in the script). Edited comments don't count.
# - Never checks out or runs pull request code: it checks out the default
#   branch, where the script lives, and talks to the API.
# - Tags only a merged pull request's merge commit that is on the default
#   branch, whose tested commit passed every check, with a version that is new
#   and newer than every release.
# - The tag is created with a short-lived token from the maintainer's release
#   app (ADR 0015). The tag ruleset lets only admins and that app create v*
#   tags, and this is the only workflow that holds the app's key.

name: Release by comment

on:
  # The same reasoning as signoff-merge.yml: issue_comment always runs the
  # workflow as it is on the default branch, the job checks out only the
  # default branch, and it acts only on the owner's exact "/release".
  # Suppressed for this line only, with the maintainer's agreement (ADR 0014).
  issue_comment:  # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag a release
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/release')
    runs-on: ubuntu-24.04
    # Holds the release app's private key; only the default branch can use it.
    environment: release-tag
    permissions:
      contents: read        # the workflow token never writes: the app creates the tag
      checks: read          # the tested commit's checks
      # Reading the pull request, and commenting and reacting on it: comments on a
      # pull request need pull-requests: write, not issues: write.
      pull-requests: write
      issues: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # The default branch only: never the pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # A short-lived token from the release app (ADR 0015), limited to this
      # repository and to contents: write. The tag ruleset lets only admins and
      # this app create v* tags. If the app isn't set up yet, the next step
      # explains that on the pull request instead of failing silently.
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_TOKEN: ${{ steps.app.outputs.token }}
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-tag.js`);
            await run({ github, context, core }, {
              versionFile: "pyproject.toml",
              // Tags created with the app's token start the Release workflow
              // ("push: tags") like a tag you push yourself.
              tagClient: process.env.TAG_TOKEN ? getOctokit(process.env.TAG_TOKEN) : null,
            });
