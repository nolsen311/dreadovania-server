name: Release

# Releases are built only from version tags, on GitHub-hosted runners, with no
# build cache (so nothing from a PR run can influence a published image).
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Adding arm64 is this one line (ADR 0003): "linux/amd64,linux/arm64".
  PLATFORMS: linux/amd64
  GRYPE_VERSION: "v0.121.2"
  COSIGN_VERSION: "v3.1.4"

jobs:
  release:
    name: Build, scan, sign and publish
    runs-on: ubuntu-24.04
    # A GitHub environment lets you add protection rules (e.g. required reviewer).
    environment: release
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless signing and attestations (Sigstore OIDC)
      attestations: write  # GitHub build-provenance attestation
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "${pkg_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Push by digest only. Nothing is tagged until the scan passes.
      - id: build
        name: Build and push (untagged)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Vulnerability scan every platform (fail on fixable high or critical)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            echo "::group::grype ${platform}"
            "${GRYPE}" "registry:${IMAGE}@${DIGEST}" --platform "${platform}" --only-fixed --fail-on high
            echo "::endgroup::"
          done

      - name: SBOM (SPDX, Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # The tags must point at exactly the digest that was scanned, signed and
      # attested. With a single source, "imagetools create" would otherwise wrap
      # the image in a new index with a different, unsigned digest (v0.1.0 was
      # published that way), so ask for a carbon copy and then check every tag.
      - name: Apply tags to the scanned digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create --prefer-index=false "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Check every tag points at the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            actual="sha256:$(docker buildx imagetools inspect --raw "${tag}" | sha256sum | cut -d' ' -f1)"
            if [ "${actual}" != "${DIGEST}" ]; then
              echo "::error::${tag} points at ${actual}, not the signed digest ${DIGEST}"
              exit 1
            fi
            echo "${tag} -> ${actual}"
          done <<< "${TAGS}"

      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image and attach SBOM attestation (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published ${IMAGE}@${DIGEST}"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Verify:"
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
