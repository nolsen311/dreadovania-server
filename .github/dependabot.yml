# Dependency updates (ADR 0008). Every update arrives as a PR and must pass CI.
# The cooldown waits a week after a release before proposing it, which gives the
# ecosystem time to catch a compromised or broken release.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Randovania and its Dread patcher must move together: Randovania's
      # "exporters" extra pins an exact open-dread-rando version (ADR 0010),
      # and tests/test_randovania_cli.py fails if they drift apart.
      randovania:
        patterns: ["randovania", "open-dread-rando"]
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
