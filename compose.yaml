# Example deployment with the hardening from docs/PLAN.md section 6.
# For production, pin the image by digest (see SECURITY.md for how to verify it).
services:
  dreadovania:
    image: ghcr.io/nolsen311/dreadovania-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      # With secure remote access checked by this server (ADR 0023): pairing and
      # invites, without a certificate. Map it elsewhere and set FRONT_DOOR_URL.
      # - "8081:8081"
    environment:
      # The address you will use in the browser; required for passkeys.
      # DREADOVANIA_PUBLIC_URL: https://dread.home.example.com
      DREADOVANIA_DATA_DIR: /data
      # HTTPS from your own certificate files (docs/https.md). Renewed files are
      # picked up without a restart.
      # DREADOVANIA_TLS_CERT_FILE: /certs/fullchain.pem
      # DREADOVANIA_TLS_KEY_FILE: /certs/privkey.pem
      # Behind a reverse proxy: its address or network, so X-Forwarded-* is believed.
      # DREADOVANIA_TRUSTED_PROXIES: 172.18.0.0/16
      # Secure remote access's front door, when the port is mapped to another one.
      # DREADOVANIA_FRONT_DOOR_URL: https://dread.home.example.com:8443
      # Offer paired Switches the latest verified app release (ADR 0021). The server
      # then contacts GitHub at most every 6 hours while the app is in use.
      # DREADOVANIA_APP_UPDATES: "off"
    volumes:
      # Seeds and server state. Must be writable by UID/GID 10001.
      - ./data:/data
      # Your own game files for patching: an extracted RomFS (version 1.0.0 or
      # 2.1.0), readable by UID 10001. See docs/game-files.md.
      # - /path/to/dread-romfs:/data/romfs:ro
      # Certificate files for HTTPS, readable by UID 10001 (docs/https.md).
      # - /path/to/certs:/certs:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
